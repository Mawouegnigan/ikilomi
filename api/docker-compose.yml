services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ikilomi
      POSTGRES_PASSWORD: ikilomi
      POSTGRES_DB: ikilomi
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikilomi"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
volumes:
  pgdata:
